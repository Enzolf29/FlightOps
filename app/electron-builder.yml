appId: com.flightops.app
productName: FlightOps
artifactName: '${productName}-Setup-${version}.${ext}'
directories:
  buildResources: resources
  output: dist
files:
  - out/**/*
  - package.json
asarUnpack:
  - '**/*.node'
  - '**/node_modules/regedit/**'
npmRebuild: false
publish:
  provider: github
  owner: Enzolf29
  repo: FlightOps
  releaseType: release
win:
  target: nsis
  icon: resources/icon.ico
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: always
